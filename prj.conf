# UART console for logging
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Logging with float support
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CBPRINTF_NANO=n

# I2C for BMA400 / MAX30208 / MAXM86161
CONFIG_I2C=y

# --- Bluetooth LE ---------------------------------------------------

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# nRF52 DK will pick the right controller automatically via board defaults.
# If your build complains about controller selection, add:
# CONFIG_BT_LL_SOFTDEVICE=y

CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

CONFIG_BT_DEVICE_NAME="RingSensor"
CONFIG_BT_DEVICE_APPEARANCE=833

# We use our own custom GATT service
CONFIG_BT_GATT_DYNAMIC_DB=y

# Standard BLE services
CONFIG_BT_BAS=y
CONFIG_BT_HRS=y

# Keep it simple for now: no bonding / SMP
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SETTINGS=n
CONFIG_SETTINGS=n

# Extra stack/heap for BLE + sensors
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ATT prepare not really used, but keep one slot
CONFIG_BT_ATT_PREPARE_COUNT=1
